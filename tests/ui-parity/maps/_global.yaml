# Rules for every UI parity case (merged into each tests/ui-parity/maps/<page>.yaml).
replace:
  # product name in product-referential strings ("Welcome to BetterMyAdmin", the home card)
  - ours: BetterMyAdmin
    pma: phpMyAdmin
    exception: X33
rules:
  # the Status pills (#statusPills) of every Status sub-page: two BetterMyAdmin-only pages
  - ours: { kind: link, label: '/^(Dashboard|Slow queries)$/', section: '/^$/' }
    exception: X64, X65
    added: >-
      X64 (Status › Dashboard) and X65 (Status › Slow queries): BetterMyAdmin-only pages, linked
      from the Status pills that phpMyAdmin's server/status/base.twig renders without them
