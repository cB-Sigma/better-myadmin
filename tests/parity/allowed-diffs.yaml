# Statements that one tool sends and the other does not, accepted on purpose.
# Only reads and connection/session set-up may be listed; the harness refuses a pattern that
# matches a write. Every entry needs a reason. See docs/architecture/11-testing-and-parity-strategy.md.
#
#   tool:    pma | bma   which side may send it without the other
#   pattern: JavaScript regex, matched against the normalised statement
#   why:     justification reviewed in the PR
#
# A write may differ only through a registered exception (docs/reference/parity-exceptions.md),
# as a suffix entry (tool: bma, `exception`): our statement is phpMyAdmin's statement matching
# `pattern` plus exactly `suffix`, at the same position, and `followedBy` must match phpMyAdmin's
# next write.
- tool: pma
  pattern: "^SHOW TABLES FROM `phpmyadmin`$"
  why: phpMyAdmin probes the configuration storage on every request; BetterMyAdmin caches pmadb discovery per session (M0 has no pmadb yet).
- tool: pma
  pattern: "^SHOW TABLES FROM `par_db`$"
  why: phpMyAdmin's DbTableExists check on every request; BetterMyAdmin validates scope lazily.
- tool: pma
  pattern: "^SHOW SESSION VARIABLES LIKE 'FOREIGN_KEY_CHECKS'$"
  why: phpMyAdmin reads the FK setting several times while rendering the page (form checkbox, inline editor); we read it once per statement.
- tool: pma
  pattern: "^SELECT 1 FROM information_schema\\.VIEWS WHERE "
  why: Table::isView / isUpdatableView for rendering the result table; the grid features that need it arrive in M1.
- tool: pma
  pattern: "^SELECT @@lower_case_table_names$"
  why: Cached server facts read lazily by phpMyAdmin during rendering.
- tool: pma
  pattern: "^SELECT \\*, `TABLE_SCHEMA` +AS `Db`"
  why: getTablesFull's information_schema query; BetterMyAdmin reads the same TABLE_ROWS/TABLE_TYPE with a narrower query (same row estimate).
- tool: bma
  pattern: "^SELECT TABLE_TYPE, TABLE_ROWS FROM information_schema\\.TABLES WHERE "
  why: The narrower equivalent of getTablesFull used for Table::countRecords.
- tool: pma
  pattern: "^SELECT `COLUMN_NAME` AS `Field`"
  why: Column metadata for the results grid (edit links, transformations) — grid metadata arrives in M1.
- tool: pma
  pattern: "^SHOW INDEXES FROM "
  why: Unique-key detection for grid editing — arrives in M1.
- tool: pma
  pattern: "^SHOW CREATE TABLE "
  why: Read by phpMyAdmin while rendering the results grid (relations) — arrives in M1.
- tool: pma
  pattern: "^SELECT @@have_profiling$"
  why: Profiling::isSupported is cached per session (SessionCache); phpMyAdmin first asks while rendering other pages.
- tool: bma
  pattern: "^SELECT @@have_profiling$"
  why: Profiling::isSupported, cached per session like SessionCache; asked the first time a Refresh-able card is built.
- tool: pma
  pattern: "^SELECT 1 FROM mysql\\.user LIMIT 1$"
  why: isSuperUser for the menu; BetterMyAdmin evaluates it only for the DROP DATABASE guard.
- tool: pma
  pattern: "^SHOW SESSION VARIABLES LIKE 'collation_connection'$"
  why: Read for the home/menu rendering.
- tool: pma
  pattern: "^SELECT CURRENT_USER\\(\\)$"
  why: Menu privilege checks (isGrantUser/isCreateUser).
- tool: pma
  pattern: "^SELECT 1 FROM \\(SELECT `GRANTEE`, `IS_GRANTABLE` FROM `INFORMATION_SCHEMA`"
  why: Menu privilege checks (isGrantUser/isCreateUser).
- tool: pma
  pattern: "^SELECT `PRIVILEGE_TYPE` FROM `INFORMATION_SCHEMA`\\.`USER_PRIVILEGES`"
  why: Menu tab visibility (Triggers/Events).
- tool: pma
  pattern: "^SELECT 1 FROM `INFORMATION_SCHEMA`\\.`(USER|SCHEMA|TABLE)_PRIVILEGES`"
  why: Menu tab visibility.
- tool: bma
  pattern: "^SHOW SESSION VARIABLES LIKE 'FOREIGN_KEY_CHECKS'$"
  why: ForeignKey::handleDisableCheckInit read (phpMyAdmin sends it too, more often).
- tool: bma
  pattern: "^SELECT CURRENT_USER\\(\\)$"
  why: Session-cached in both tools (SessionCache mysql_cur_user); phpMyAdmin filled its cache while rendering the page after login, BetterMyAdmin on its first request that needs it.
- tool: bma
  pattern: "^SHOW GRANTS$"
  why: UserPrivilegesFactory::analyseShowGrant, session-cached in both tools; phpMyAdmin ran it while rendering the page after login.
- tool: bma
  pattern: "^SELECT @@lower_case_table_names$"
  why: Server fact phpMyAdmin reads once per request (allowed above); BetterMyAdmin keeps it for the session.
- tool: pma
  pattern: "^SELECT CURRENT_ROLE\\(\\)$"
  why: Menu privilege checks run on every phpMyAdmin response (getCurrentRolesAndHost).
- tool: pma
  pattern: "^SHOW GRANTS FOR CURRENT_USER\\(\\)$"
  why: Menu privilege checks (isGrantUser/isCreateUser) for restricted accounts.
- tool: pma
  pattern: "^SHOW TABLES FROM `[^`]+`$"
  why: DbTableExists checks the database the request ends in (e.g. after USE in import mode) while rendering the menu.
- tool: pma
  pattern: "^SELECT 1 FROM `par_db`\\.`[^`]+` LIMIT 1$"
  why: DbTableExists::hasTable for a table-scope request; BetterMyAdmin validates scope lazily.
- tool: pma
  pattern: "^SHOW TABLES FROM `par_db` LIKE '[^']+';?$"
  why: DbTableExists::hasTable asks SHOW TABLES first since upstream 3e46bcca8a, for a table-scope request; BetterMyAdmin validates scope lazily.
- tool: pma
  pattern: "^SELECT `CATALOG_NAME` FROM `information_schema`\\.`SCHEMATA` WHERE `SCHEMA_NAME` = "
  why: phpMyAdmin probes the configuration storage database while rendering; pmadb discovery is cached per session.
- tool: bma
  pattern: "^SELECT 1 FROM mysql\\.user LIMIT 1$"
  why: isSuperUser for the DROP DATABASE guard; phpMyAdmin answers it from SessionCache filled while rendering earlier pages.
- tool: bma
  pattern: "^SHOW TABLES FROM `phpmyadmin`$"
  why: Configuration-storage discovery (Relation::initRelationParamsCache / checkRelationsParam). phpMyAdmin runs it on every request on its control link, which the reference instance logs under its controluser `pma`; the BetterMyAdmin server of sql-box.parity has no controluser, so its control link uses the test user's credentials, once per session.
- tool: bma
  pattern: "^SELECT NULL FROM `pma__[a-z_]+` LIMIT 0$"
  why: Same discovery (Relation::canAccessStorageTable probes), on the user's credentials when no controluser is configured.
- tool: bma
  pattern: "^SHOW COLUMNS FROM `phpmyadmin`\\.`pma__column_info` WHERE Field IN "
  why: Same discovery (Relation::tryUpgradeTransformations), on the user's credentials when no controluser is configured.
- tool: bma
  pattern: "^SELECT `config_data`, UNIX_TIMESTAMP\\(`timevalue`\\) ts FROM `phpmyadmin`\\.`pma__userconfig` WHERE "
  why: UserPreferences::load — phpMyAdmin reads it through its control user on every request, BetterMyAdmin once per session (on the user's credentials when no controluser is configured).
- tool: bma
  pattern: "^SELECT CREATE_TIME FROM information_schema\\.TABLES WHERE TABLE_SCHEMA = "
  why: Table::getStatusInfo('CREATE_TIME') for the UI-preferences check; phpMyAdmin reads it with getTablesFull's `SELECT *, TABLE_SCHEMA AS Db` query (allow-listed for pma above), BetterMyAdmin reads only that column (same value).
- tool: bma
  pattern: "^SELECT `tables` FROM `phpmyadmin`\\.`pma__recent` WHERE `username` = "
  why: RecentFavoriteTables::getFromDb for RecentTableHandling (a request with db + table). phpMyAdmin reads it on its control link (the reference's controluser `pma`, not logged for the test user); the parity server has no controluser, so the read uses the test user's link, once per session.
- tool: bma
  pattern: "^SELECT 1 FROM `par_db`\\.`[^`]+` LIMIT 1;?$"
  why: DbTableExists::hasTable before RecentTableHandling adds the table (phpMyAdmin checks the same table while rendering, allowed for pma above).
- tool: bma
  pattern: "^SHOW TABLES FROM `par_db` LIKE '[^']+';?$"
  why: The SHOW TABLES half of the same DbTableExists::hasTable check (upstream 3e46bcca8a; allowed for pma above).
- tool: bma
  pattern: "^SHOW TABLES FROM `par_db`$"
  why: ZeroConf configuration-storage discovery in the current database (Relation::fixPmaTables) when the user cannot use the `phpmyadmin` storage; phpMyAdmin runs it on every request (allowed for pma above), BetterMyAdmin once per session.
- tool: bma
  pattern: "^SELECT 1 FROM mysql\\.user LIMIT 1$"
  why: DatabaseInterface::isSuperUser is session-cached in both tools (SessionCache is_superuser); phpMyAdmin filled it while rendering the menu of the page after login, BetterMyAdmin on its first request that needs it.
- tool: pma
  pattern: "^SELECT @@disabled_storage_engines$"
  why: Session-cached in both tools (SessionCache disabled_storage_engines); read on the first page that lists storage engines, which differs between the tools (menus).
- tool: bma
  pattern: "^SELECT @@disabled_storage_engines$"
  why: Session-cached in both tools (SessionCache disabled_storage_engines), see the pma entry.
- tool: pma
  pattern: "^SELECT @@basedir$"
  why: DatabaseInterface::isAmazonRds, session-cached in both tools (SessionCache is_amazon_rds).
- tool: bma
  pattern: "^SELECT @@basedir$"
  why: DatabaseInterface::isAmazonRds, session-cached in both tools (SessionCache is_amazon_rds).
- tool: bma
  exception: X40
  pattern: "^GRANT [A-Z ,()`a-z0-9_]+ ON (PROCEDURE |FUNCTION )?(?:\\*\\.\\*|`(?:[^`]|``)+`\\.(?:\\*|`(?:[^`]|``)+`)) TO '(?:[^'\\\\]|\\\\.)*'@'(?:[^'\\\\]|\\\\.)*'$"
  suffix: " WITH GRANT OPTION"
  followedBy: "^ALTER USER '(?:[^'\\\\]|\\\\.)*'@'(?:[^'\\\\]|\\\\.)*' ?( REQUIRE .*| WITH .*)?$"
  why: "X40: phpMyAdmin bug, silently drops the requested grant option (https://github.com/phpmyadmin/phpmyadmin/issues/19605). On MySQL >= 8.0.11 an Edit privileges GRANT with Grant_priv=Y (global, database, table or routine) ends with WITH GRANT OPTION in BetterMyAdmin; phpMyAdmin's following ALTER USER is sent unchanged."
