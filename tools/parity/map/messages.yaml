# The settings forms (FormDisplay, Descriptions, Forms/*): generated/pma-forms.json keeps the msgids,
# translated (and BBCode converted) when a form is rendered.
data:
  packages/config/src/generated/pma-forms.json:
    - paths: [fields.*.name, fields.*.desc, fields.*.cmt]
      at: apps/server/src/preferences/form-display.ts::describe
    - paths: ['*.*.forms.*.title', '*.*.forms.*.desc']
      at: apps/server/src/preferences/form-display.ts::describeForm
    - paths: ['*.*.forms.*.items.*.group']
      at: apps/server/src/preferences/form-display.ts::display
    - paths: [fields.*.values.*.label]
      at: apps/server/src/preferences/form-display.ts::msgText
    - paths: [setup.*.name]
      at: apps/server/src/setup/service.ts::setupPages
