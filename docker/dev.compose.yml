# Development and parity services. Usage: docker compose -f docker/dev.compose.yml up -d
# - mysql84 / mariadb11: test servers (root/root), general log on for the parity harness, as an
#   indexed MyISAM table (seed/00-general-log.sql; see docs/architecture/14-development-setup.md)
# - phpmyadmin-ref: phpMyAdmin at the reference commit (docs/reference/reference-commit.txt) on :8081
# - phpmyadmin-ref-i18n: the same with compiled translations (like a release) on :8082, Japanese
#   always among them (tests/parity/export-kanji)
# - mysql84-replica (:3308): a replica of mysql84 (seed/replica/10-replica.sh), and
#   phpmyadmin-ref-replica (:8083) whose only server it is, for tests/parity/server-replication
# - BMA_PARITY_TARGET=mariadb: mariadb11 (:3307) with phpmyadmin-ref-mariadb (:8084), and
#   mariadb11-replica (:3309) with phpmyadmin-ref-mariadb-replica (:8085)
# - redis (:6379, password s3cret): SessionStore 'redis' (apps/server/test/int/redis-session.test.ts)
# the reference commit, passed as a build arg to every phpmyadmin-ref* image so the Dockerfile ARG
# default and this stay together (docs/reference/reference-commit.txt; bump on an upstream sync).
# Override with the PMA_COMMIT env var.
x-pma-commit: &pma_commit "${PMA_COMMIT:-6f240a8f64d0a4c62a02b0ef484568fe39017480}"

services:
  redis:
    image: redis:7-alpine
    command: ["--requirepass", "s3cret"]
    ports: ["127.0.0.1:6379:6379"]
  mysql84:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root }
    command: ["--general-log=1", "--log-output=TABLE", "--max-connections=1000"]
    ports: ["3306:3306"]
    volumes:
      - "./seed/00-general-log.sql:/docker-entrypoint-initdb.d/00-general-log.sql:ro"
      - "./seed/pmadb.sql:/docker-entrypoint-initdb.d/01-pmadb.sql:ro"
      - "./seed/02-replication-user.sql:/docker-entrypoint-initdb.d/02-replication-user.sql:ro"
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-proot"], interval: 5s, retries: 30 }
  mysql84-replica:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root, REPLICA_SOURCE_HOST: mysql84, REPLICA_SOURCE_PORT: "3306" }
    # no binary log (a replica only); applies only f06r_repl, and the other suites' statements never
    # stop it (the replica parses a statement before its database filter applies)
    command:
      - --server-id=2
      - --skip-log-bin
      - --report-host=mysql84-replica
      - --report-port=3306
      - --replicate-do-db=f06r_repl
      - --replica-skip-errors=all
      - --general-log=1
      - --log-output=TABLE
    ports: ["3308:3306"]
    volumes:
      - "./seed/00-general-log.sql:/docker-entrypoint-initdb.d/00-general-log.sql:ro"
      - "./seed/replica/10-replica.sh:/docker-entrypoint-initdb.d/10-replica.sh:ro"
    depends_on: { mysql84: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-proot"], interval: 5s, retries: 30 }
  # MariaDB 11.4 primary (binary log on) with its own pmadb, for BMA_PARITY_TARGET=mariadb
  mariadb11:
    image: mariadb:11.4
    environment: { MARIADB_ROOT_PASSWORD: root }
    # log-bin-trust-function-creators: binary logging is on, so without it a non-SUPER user cannot
    # create or drop a trigger/function (#1419) — a standard dev-server relaxation (phpMyAdmin needs it)
    command: ["--server-id=11", "--log-bin=mariadb-bin", "--log-bin-trust-function-creators=1", "--general-log=1", "--log-output=TABLE", "--max-connections=1000"]
    ports: ["3307:3306"]
    volumes:
      - "./seed/00-general-log.sql:/docker-entrypoint-initdb.d/00-general-log.sql:ro"
      - "./seed/pmadb.sql:/docker-entrypoint-initdb.d/01-pmadb.sql:ro"
      - "./seed/02-replication-user.sql:/docker-entrypoint-initdb.d/02-replication-user.sql:ro"
      - "./seed/03-mariadb-plugins.sql:/docker-entrypoint-initdb.d/03-mariadb-plugins.sql:ro"
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect"], interval: 5s, retries: 30 }
  mariadb11-replica:
    image: mariadb:11.4
    environment: { MARIADB_ROOT_PASSWORD: root, REPLICA_SOURCE_HOST: mariadb11, REPLICA_SOURCE_PORT: "3306" }
    command:
      - --server-id=12
      - --report-host=mariadb11-replica
      - --report-port=3306
      - --replicate-do-db=f06r_repl
      - --slave-skip-errors=all
      - --general-log=1
      - --log-output=TABLE
    ports: ["3309:3306"]
    volumes:
      - "./seed/00-general-log.sql:/docker-entrypoint-initdb.d/00-general-log.sql:ro"
      - "./seed/replica/10-replica-mariadb.sh:/docker-entrypoint-initdb.d/10-replica.sh:ro"
    depends_on: { mariadb11: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect"], interval: 5s, retries: 30 }
  phpmyadmin-ref:
    build: { context: ./pma-ref, args: { PMA_COMMIT: *pma_commit } }
    environment: { PMA_HOST: mysql84 }
    ports: ["8081:8081"]
    depends_on: { mysql84: { condition: service_healthy } }
  # the same commit with compiled translations (release behaviour) for tests/parity/i18n.parity.test.ts,
  # and Japanese for tests/parity/export-kanji.parity.test.ts (an empty catalog if the release drops it)
  phpmyadmin-ref-i18n:
    build: { context: ./pma-ref, args: { PMA_COMMIT: *pma_commit, PMA_TRANSLATIONS: "1", PMA_LOCALE_STUBS: "ja" } }
    environment: { PMA_HOST: mysql84 }
    ports: ["8082:8081"]
    depends_on: { mysql84: { condition: service_healthy } }
  phpmyadmin-ref-replica:
    build: { context: ./pma-ref, args: { PMA_COMMIT: *pma_commit } }
    environment: { PMA_HOST: mysql84-replica, PMA_REPLICA: "1" }
    ports: ["8083:8081"]
    depends_on: { mysql84-replica: { condition: service_healthy } }
  phpmyadmin-ref-mariadb:
    build: { context: ./pma-ref, args: { PMA_COMMIT: *pma_commit } }
    environment: { PMA_HOST: mariadb11 }
    ports: ["8084:8081"]
    depends_on: { mariadb11: { condition: service_healthy } }
  phpmyadmin-ref-mariadb-replica:
    build: { context: ./pma-ref, args: { PMA_COMMIT: *pma_commit } }
    environment: { PMA_HOST: mariadb11-replica, PMA_REPLICA: "1" }
    ports: ["8085:8081"]
    depends_on: { mariadb11-replica: { condition: service_healthy } }
